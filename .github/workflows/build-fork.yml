name: Fork Build

# Workflow build milik fork tasirin1/tasirin-cloudstream.
# Workflow upstream (Pre-release, Archive build, Dokka) dinonaktifkan
# di fork ini karena bergantung pada secrets organisasi recloudstream
# (GH_APP_ID/GH_APP_KEY + repo privat recloudstream/secrets) yang tidak
# ada di fork. Workflow ini TIDAK memakai secret apa pun: APK
# prerelease debug ditandatangani debug key bawaan Android dan bisa
# langsung dipasang untuk uji.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "fork-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: cloudstream-prerelease-debug
        path: "app/build/outputs/apk/prerelease/debug/*.apk"
