name: Fork Build

# Workflow build milik fork tasirin1/tasirin-cloudstream.
# Workflow upstream (Pre-release, Archive build, Dokka) dinonaktifkan
# di fork ini karena bergantung pada secrets organisasi recloudstream
# (GH_APP_ID/GH_APP_KEY + repo privat recloudstream/secrets) yang tidak
# ada di fork. Workflow ini TIDAK memakai secret apa pun: APK
# prerelease debug ditandatangani debug key bawaan Android dan bisa
# langsung dipasang untuk uji.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "fork-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseFullDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: cloudstream-prerelease-debug
        path: "app/build/outputs/apk/prereleaseFull/debug/*.apk"

    # Fork addition: STB lite build for 32-bit TV boxes (B860H class).
    # The "lite" product flavor (release variant: dex without debug
    # info, English + Indonesian resources, no torrent/FFmpeg/Zipline).
    # The release output is unsigned (no upstream signing secrets in
    # this fork), so it is signed with a throwaway keystore generated
    # in this step. NOTE: its signature differs from the debug APKs,
    # so the lite APK cannot update them in place; uninstall first.
    - name: Build STB lite release
      run: ./gradlew assemblePrereleaseLiteRelease

    - name: Sign STB lite APK with a throwaway key
      run: |
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        IN=$(ls app/build/outputs/apk/prereleaseLite/release/*armeabi-v7a*release-unsigned.apk)
        echo "Signing $IN with build-tools $BT"
        keytool -genkeypair -keystore stb-lite.keystore \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        "$BT/zipalign" -f 4 "$IN" app/build/outputs/apk/prereleaseLite/release/stb-lite-aligned.apk
        "$BT/apksigner" sign \
          --ks stb-lite.keystore \
          --ks-pass pass:android --key-pass pass:android \
          --ks-key-alias androiddebugkey \
          --out app/build/outputs/apk/prereleaseLite/release/cloudstream-stb-lite.apk \
          app/build/outputs/apk/prereleaseLite/release/stb-lite-aligned.apk
        "$BT/apksigner" verify --print-certs app/build/outputs/apk/prereleaseLite/release/cloudstream-stb-lite.apk | head -3
        ls -la app/build/outputs/apk/prereleaseLite/release/cloudstream-stb-lite.apk

    - name: Upload STB lite Artifact
      uses: actions/upload-artifact@v7
      with:
        name: cloudstream-stb-lite
        path: "app/build/outputs/apk/prereleaseLite/release/cloudstream-stb-lite.apk"
