name: Fork Build

# Workflow build milik fork tasirin1/tasirin-cloudstream.
# Workflow upstream (Pre-release, Archive build, Dokka) dinonaktifkan
# di fork ini karena bergantung pada secrets organisasi recloudstream
# (GH_APP_ID/GH_APP_KEY + repo privat recloudstream/secrets) yang tidak
# ada di fork. Workflow ini TIDAK memakai secret apa pun.
#
# Fork ini LITE-ONLY (keputusan owner 2026-11-19): hanya ada satu
# varian — prerelease release untuk STB 32-bit (B860H) — yang
# ditandatangani kunci sekali-pakai buatan CI.

on:
  push:
    branches: [ master ]
    # Fork addition: pushing a version tag also publishes the
    # GitHub release automatically (see the last step).
    tags: [ 'v4.9.*' ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "fork-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    # The release output is unsigned (no upstream signing secrets in
    # this fork), so it is signed with a throwaway keystore generated
    # in the sign step below. NOTE: its signature differs from one
    # release to the next (throwaway CI key), so a new lite APK cannot
    # update an installed one in place; uninstall first.
    - name: Build lite release
      run: ./gradlew assemblePrereleaseRelease

    - name: Sign lite APK with a throwaway key
      run: |
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        IN=$(ls app/build/outputs/apk/prerelease/release/*armeabi-v7a*release-unsigned.apk)
        echo "Signing $IN with build-tools $BT"
        keytool -genkeypair -keystore stb-lite.keystore \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        "$BT/zipalign" -f 4 "$IN" app/build/outputs/apk/prerelease/release/stb-lite-aligned.apk
        "$BT/apksigner" sign \
          --ks stb-lite.keystore \
          --ks-pass pass:android --key-pass pass:android \
          --ks-key-alias androiddebugkey \
          --out app/build/outputs/apk/prerelease/release/cloudstream-stb-lite.apk \
          app/build/outputs/apk/prerelease/release/stb-lite-aligned.apk
        "$BT/apksigner" verify --print-certs app/build/outputs/apk/prerelease/release/cloudstream-stb-lite.apk | head -3
        ls -la app/build/outputs/apk/prerelease/release/cloudstream-stb-lite.apk

    - name: Upload lite Artifact
      uses: actions/upload-artifact@v7
      with:
        name: cloudstream-stb-lite
        path: "app/build/outputs/apk/prerelease/release/cloudstream-stb-lite.apk"

    # Fork addition: automatic GitHub release. Pushing a version tag
    # (v4.9.x) publishes a full release with the lite APK from this
    # same build; branch pushes only produce artifacts for testing.
    - name: Publish GitHub release (tag builds only)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat > release-notes.md <<'NOTES'
        Rilis otomatis Tasirin CloudStream dari tag versi (workflow Fork Build).

        Berkas:
        - `cloudstream-stb-lite.apk` — satu-satunya varian (fork lite-only): STB 32-bit (B860H), armeabi-v7a. Tanda tangannya beda dari rilis sebelumnya (kunci sekali-pakai CI): hapus pemasangan lama dulu, baru pasang.
        NOTES
        # Idempotent: re-running a tag build whose release already
        # exists replaces the APK instead of failing the whole run.
        if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
          gh release upload "${{ github.ref_name }}" \
            app/build/outputs/apk/prerelease/release/cloudstream-stb-lite.apk \
            --clobber
        else
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            app/build/outputs/apk/prerelease/release/cloudstream-stb-lite.apk
        fi
